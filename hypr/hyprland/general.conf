#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 8

    border_size = 3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(b4befe) rgb(7f11e0) 60deg
    col.inactive_border = rgb(585B70)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 9
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 0.8
    inactive_opacity = 0.7

    shadow {
        enabled = true
        range = 1
        render_power = 2
        color = rgba(0a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 3
        brightness = 1.5

        vibrancy = 0.8696
        vibrancy_darkness = -0.8696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes #please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = linear,-1,0,1,1
    bezier = almostLinear,-1.5,0.5,0.75,1.0
    bezier = quick,-1.15,0,0.1,1
  
    #sine
    bezier = easeInSine,0.12, 0, 0.39, 0
    bezier = easeOutSine,0.61, 1, 0.88, 1,
    bezier = easeInOutSine,0.37, 0, 0.63, 1

    #Exponential
    bezier = easeInExpo,0.7, 0, 0.84, 0
    bezier = easeOutExpo,0.16, 1, 0.3, 1
    bezier = easeInOutExpo,0.87, 0, 0.13, 1
    
    #Quint
    bezier = easeInQuint,0.64,0,0.78,0
    bezier = easeOutQuint,0.22, 1, 0.36, 1
    bezier = easeInOutQuint,0.83,0,0.17,1

    #cubic
    bezier = easeInCubic, 0.32,0,0.67,0
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    bezier = easeInOutCubic,0.65,0,0.35,1

    #cicle
    bezier = easeInCirc , 0.55, 0, 1, 0.45
    bezier = easeOutCirc ,0,0.55,0.45,1
    bezier = easeInOutCirc , 0.85,0,0.15,1


    # global
    #  ↳ windows - styles: slide, popin, gnomed
    #  ↳ windowsIn - window open - styles: same as windows
    #  ↳ windowsOut - window close - styles: same as windows
    #  ↳ windowsMove - everything in between, moving, dragging, resizing.
    animation = global, 1, 10, default
    animation = windows, 1, 4.79, easeInCubic
    animation = windowsIn, 1, 4.1, easeInCubic #, popin 87%
    animation = windowsOut, 1, 1.49, easeOutCubic #, popin 87%
    #animation = windowsMove, 0,1.49,

    # fade
    # ↳ fadeIn - fade in for window open
    # ↳ fadeOut - fade out for window close
    # ↳ fadeSwitch - fade on changing activewindow and its opacity
    # ↳ fadeShadow - fade on changing activewindow for shadows
    # ↳ fadeDim - the easing of the dimming of inactive windows
    # ↳ fadeLayers - for controlling fade on layers
    #   ↳ fadeLayersIn - fade in for layer open
    #   ↳ fadeLayersOut - fade out for layer close
    #animation = fade, 1, 3.03, quick
    animation = fadeIn, 1, 2.73, easeInCubic
    animation = fadeOut, 1, 2.46, easeInOutCubic
    animation = fadeLayersIn, 1, 2.79, easeInCubic
    animation = fadeLayersOut, 1, 1.39, easeInOutCubic
    
    # ↳ layers - styles: slide, popin, fade
    #    ↳ layersIn - layer open
    #    ↳ layersOut - layer close
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade

    # ↳ border - for animating the border's color switch speed
    animation = border, 1, 5.39, easeOutExpo
    # ↳ borderangle - for animating the border's gradient angle - styles: once (default), loop


    # ↳ workspaces - styles: slide, slidevert, fade, slidefade, slidefadevert
    # ↳ workspacesIn - styles: same as workspaces
    # ↳ workspacesOut - styles: same as workspaces
    # ↳ specialWorkspace - styles: same as workspaces
    #   ↳ specialWorkspaceIn - styles: same as workspaces
    #   ↳ specialWorkspaceOut - styles: same as workspaces
    animation = workspaces, 1, 1.94, easeInCirc, fade
    animation = workspacesIn, 1, 1.21, easeInCirc, fade
    animation = workspacesOut, 1, 1.94, easeOutCirc, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv0], gapsout:0, gapsin:0
# workspace = f[0], gapsout:0, gapsin:0
# windowrule = bordersize -1, floating:0, onworkspace:w[tv1]
# windowrule = rounding -1, floating:0, onworkspace:w[tv1]
# windowrule = bordersize -1, floating:0, onworkspace:f[1]
# windowrule = rounding -1, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    # animate_manual_resizes = true
}
