# Add Preferable Keybinds Here

# https://wiki.hyprland.org/Configuration/Binds



# bind = MODS, key, dispatcher, params

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$shiftMod = SUPER SHIFT
$ctrlShift = CTRL SHIFT
$ctrlAlt = CTRL ALT
$files = thunar
$term = kitty
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

#Common Keybinds
bind = $ctrlAlt,T,exec ,$term
bind = $mainMod, Return, exec, $term  #terminal
bind = $mainMod, E, exec, $files #file manager
bind = $mainMod SHIFT,Q , killactive,

bind = $mainMod SHIFT, M, exit,

#bind = $mainMod, D , exec, $UserScripts/menu.sh #-c $WofiConfig -s $WofiStyle

bind = $mainMod, D , exec, $UserScripts/menu.sh

bind = $mainMod, SPACE, togglefloating,

bind= $shiftMod,c,exec,hyprctl reload
bind = $mainMod,F,fullscreen,0
# Waybar
# Waybar / Bar related
bind = $shiftMod, B, exec, pkill -SIGUSR1 waybar # Toggle hide/show waybar 
bind = $shiftMod CTRL ,B, exec , ~/.config/waybar/launch.sh

#HyprShot
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window -z
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output -z
# Screenshot a region
bind = $shiftMod, PRINT, exec, hyprshot -m region -z

#Resize with keyboard only 
# bind = $mainMod , R , resizewindow
binde = $mainMod SHIFT, right, resizeactive,  20   0
binde = $mainMod SHIFT, left , resizeactive, -20   0
binde = $mainMod SHIFT, up   , resizeactive,   0   20
binde = $mainMod SHIFT, down , resizeactive,   0  -20

#Open Vscode 
bind = $mainMod , C , exec , code &
