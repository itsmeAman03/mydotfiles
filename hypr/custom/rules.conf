# You can add custom rules here 

# Window/Layer Rules:
# https://wiki.hyprland.org/Configuration/Window-Rules

# Work Space Rules

#https://wiki.hyprland.org/Configuration/Workspace-Rules


#clipse window rules 
windowrule = float, class:(clipse)
windowrule = size 622 652, class:(clipse)
windowrule = stayfocused, class:(clipse)

bind = SUPER, V, exec, kitty --class clipse -e clipse

#run vscode on native 
windowrule = nofocus,class:Code,xwayland:0,floating:1,fullscreen:0,pinned:0
# windowrule = focus,class:firefox,blur:0

layerrule = ignorezero,rofi
layerrule = ignorealpha 0.7,rofi

#windowrule = noshadow,class:firefox
